{% extends 'base.html' %}
{% block content %}
    <div class="container mt-5 shadow" style="max-width: 600px; padding: 50px; border-radius: 10px; background-color: #E3F2FD;">
        <h3 class="text-center">Import Data To Database Tables</h3>
        <form action="{% url 'import-data' %}" method="POST" enctype="multipart/form-data" style="max-width: 600px; margin:auto; padding-top: 50px;">
            {% csrf_token %}
            <div class="mb3">
                <label for="file_path">Upload CSV File</label>
                <input type="file" name="file_path" class="form-control" required>
            </div>
            <div class="mb3">
                <label for="model_name">Select Database Table</label>
                <select name="model_name" class="form-control" required>
                    <option value="" disabled selected>Select</option>
                    {% for model in custom_models %}
                        <option value="{{ model }}">{{ model }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb3">
                <input type="submit" value="Import Data" class="btn btn-primary">
            </div>
            {% include 'alerts.html' %}
        </form>

    </div>
{% endblock %}
